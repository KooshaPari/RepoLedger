name: Inspect CI Repair Formatting Once

on:
  push:
    branches:
      - fix/ci-pnpm-gitleaks-history-20260904
    paths:
      - .github/workflows/format-ci-repair-once.yml

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/ci-pnpm-gitleaks-history-20260904
          fetch-depth: 0

      - name: Print exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          npm install --global prettier@3.6.2
          prettier --write .github/workflows/ci.yml
          echo '--- PRETTIER DIFF BEGIN ---'
          git --no-pager diff -- .github/workflows/ci.yml
          echo '--- PRETTIER DIFF END ---'
