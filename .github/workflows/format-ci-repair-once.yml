name: Format CI Repair Once

on:
  push:
    branches:
      - fix/ci-pnpm-gitleaks-history-20260904
    paths:
      - .github/workflows/format-ci-repair-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/ci-pnpm-gitleaks-history-20260904
          fetch-depth: 0

      - name: Format workflow and remove formatter
        shell: bash
        run: |
          set -euo pipefail
          npm install --global prettier@3.6.2
          prettier --write .github/workflows/ci.yml
          git rm .github/workflows/format-ci-repair-once.yml

      - name: Commit formatted workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style(ci): format RepoLedger workflow'
          git push origin HEAD:fix/ci-pnpm-gitleaks-history-20260904
