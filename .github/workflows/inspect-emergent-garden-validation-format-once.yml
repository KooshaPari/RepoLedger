name: Inspect Emergent Garden Validation Format Once

on:
  push:
    branches:
      - docs/emergent-garden-wave1-projection-20260904
    paths:
      - .github/workflows/inspect-emergent-garden-validation-format-once.yml

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout projection branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: docs/emergent-garden-wave1-projection-20260904
          fetch-depth: 0

      - name: Print exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          npm install --global prettier@3.6.2
          prettier --write audits/org-audit-snapshots/2026-09-04-emergent-garden-wave-2-validation-state.md
          echo '--- PRETTIER DIFF BEGIN ---'
          git --no-pager diff -- audits/org-audit-snapshots/2026-09-04-emergent-garden-wave-2-validation-state.md
          echo '--- PRETTIER DIFF END ---'
